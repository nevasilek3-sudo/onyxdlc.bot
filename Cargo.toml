[package]
name = "telegrambot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.14", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
dptree = "0.3"
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-native-tls", "migrate"] }
dotenvy = "0.15"
log = "0.4"
pretty_env_logger = "0.5"
