[package]
name = "telegrambot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.14", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
dptree = "0.3"
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-native-tls", "migrate", "chrono", "json"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
log = "0.4"
pretty_env_logger = "0.5"
